name: Desktop App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x64 / NSIS / MSI)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: macOS Universal (Apple Silicon & Intel)
            os: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          - name: Linux (x64 / AppImage / Deb)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update preinstalled Rust (macOS)
        if: runner.os == 'macOS'
        run: rustup update stable --no-self-update

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # rustup has no universal-apple-darwin target; Tauri needs BOTH arch
          # std components installed and merges them with lipo at build time.
          targets: ${{ matrix.platform.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform.target }}

      - name: Install Linux system dependencies (GTK / WebKit2GTK / AppIndicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build TypeScript router server
        run: npm run build

      - name: Generate multi-resolution icons
        run: npm run tauri:icons

      - name: Build Desktop Application (Tauri v2)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Local Router Desktop v__VERSION__"
          releaseBody: "Native cross-platform desktop application with corner system tray controls, Ollama drop-in interception, self-healing fallback chains, and 23 built-in model providers."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.platform.args }}

  verify-manifest:
    name: Verify updater manifest
    # Runs only after every platform has uploaded. The release is created with
    # this workflow's own GITHUB_TOKEN, and GitHub does not start a workflow from
    # an event that token raised, so `promote` below calls the promotion workflow
    # directly instead of waiting for `release: published`.
    needs: build-desktop
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          CONF_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TOML_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          LOCK_VERSION="$(awk '/^name = "local-router"$/{f=1; next} f && /^version = /{gsub(/version = |"/, ""); print; exit}' src-tauri/Cargo.lock)"
          # All four version files must agree (RELEASING.md §1): a release built
          # with a stale Cargo.lock entry is exactly how v1.2.1 shipped one.
          if [ "$CONF_VERSION" != "$PKG_VERSION" ] || [ "$CONF_VERSION" != "$TOML_VERSION" ] || [ "$CONF_VERSION" != "$LOCK_VERSION" ]; then
            echo "::error::version drift: package.json=$PKG_VERSION tauri.conf.json=$CONF_VERSION Cargo.toml=$TOML_VERSION Cargo.lock=$LOCK_VERSION"
            exit 1
          fi
          EXPECTED="v$CONF_VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::pushed tag $GITHUB_REF_NAME does not match the configured version ($EXPECTED)"
            exit 1
          fi
          echo "tag=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "release tag: $EXPECTED"

      - name: Verify updater manifest on the release (fail closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/verify-updater-manifest.mjs "$RELEASE_TAG"

  promote:
    name: Promote to production and the website
    needs: [build-desktop, verify-manifest]
    # A reusable workflow is called as a JOB (`uses` + `with` + `secrets`), never
    # as a step: a step-level `uses` pointing at a workflow file makes the whole
    # file invalid, and GitHub then fails every push at startup with no jobs —
    # which is how v1.2.2's first tag attempt died without building anything.
    uses: ./.github/workflows/promote-website-release.yml
    with:
      tag: ${{ needs.verify-manifest.outputs.tag }}
    secrets: inherit